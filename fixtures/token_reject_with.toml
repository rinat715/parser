[test_1]
input = "--reject-with tcp-reset -"
expected.value = "tcp-reset"
expected.negative = false
expected.name = "reject-with"
remaining = " -"

[test_2]
input = "--reject-with tcp-reset\n"
expected.value = "tcp-reset"
expected.negative = false
expected.name = "reject-with"
remaining = "\n"

[test_3]
input = "--reject-with tcp-reset !"
expected.value = "tcp-reset"
expected.negative = false
expected.name = "reject-with"
remaining = " !"

