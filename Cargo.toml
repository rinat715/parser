[package]
name = "parser"
version = "0.1.0"
edition = "2021"

[lib]
name = "parser"
crate-type = ["cdylib"]

[dependencies]
nom = "7.1.3"
serde = "1.0.219"
serde_derive = "1.0.219"
toml = { version = "0.8.22", features = ["preserve_order"] }
log = { version = "0.4"}
domain = { path = "domain" }
macros = { path = "macros" }
common = { path = "common" }

[dev-dependencies]
tester = { path = "tester" }
diff = { path = "diff" }

[dependencies.pyo3]
version = "0.15.2"
features = ["abi3-py36", "extension-module", "auto-initialize"]