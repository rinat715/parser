[test_1]
input = "-A INPUT -g TEST --ctstate RELATED,ESTABLISHED"
remaining = ""

[test_1.expected]
ActionModifiers = []
NormalizedAction = "jump"

[[test_1.expected.Action]]
action = "GOTO"
option = "TEST"

[test_2]
input = " -j MY_CHAIN"
remaining = ""

[test_2.expected]
ActionModifiers = []
NormalizedAction = "jump"

[[test_2.expected.Action]]
action = "JUMP"
option = "MY_CHAIN"

[test_3]
input = " -j REJECT --reject-with tcp-reset"
remaining = ""

[test_3.expected]
ActionModifiers = []
NormalizedAction = "deny"

[[test_3.expected.Action]]
action = "REJECT"
option = "tcp-reset"


[test_4]
input = " -A INPUT -j LOG --log-prefix \"hello guys\""
remaining = ""

[[test_4.expected.ActionModifiers]]
action = "log-level"
option = "warning"

[[test_4.expected.ActionModifiers]]
action = "log-prefix"
option = '"hello guys"'

[[test_4.expected.Action]]
action = "LOG"
option = ""

[test_5]
input = " -j LOG --log-ip-options --log-tcp-sequence --log-tcp-options --log-level debug"
remaining = ""


[[test_5.expected.ActionModifiers]]
action = "log-level"
option = "debug"

[[test_5.expected.ActionModifiers]]
action = "log-ip-options"
option = ""

[[test_5.expected.ActionModifiers]]
action = "log-tcp-sequence"
option = ""

[[test_5.expected.ActionModifiers]]
action = "log-tcp-options"
option = ""

[[test_5.expected.Action]]
action = "LOG"
option = ""


[test_6]
input = "-A INPUT -s 192.168.0.0/16 -d 172.16.255.0/24 -p tcp -m tcp --dports 22,23 -m multiport --sports 300:400 -j MY_CHAIN"
remaining = ""

[test_6.expected]
ActionModifiers = []
NormalizedAction = "jump"

[[test_6.expected.Action]]
action = "JUMP"
option = "MY_CHAIN"

[test_6.expected.Protocol]
operator = "eq"
values = ["tcp"]

[[test_6.expected.TCPUDPOptions.SourcePorts]]
operator = "eq"
values = [300]

[[test_6.expected.TCPUDPOptions.DestinationPorts]]
operator = "eq"
values = [22]