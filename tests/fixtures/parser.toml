[test_1]
input = " -j REJECT"
remaining = ""

[test_1.expected]
jump = "REJECT"

[test_2]
input = "-A INPUT"
expected.name = "INPUT"
remaining = ""

[test_3]
input = "-A INPUT dfdf"
expected.name = "INPUT dfdf"
remaining = ""

[test_4]
input = " --log-ip-option\ns"
expected.log-ip-option = "tag"
remaining = "\ns"

[test_5]
input = "-A check_ours -j RETURN --log-prefix \"BG \" 123\""
remaining = ""

[test_5.expected]
name = "check_ours"
jump = "RETURN"
log-prefix = "\"BG \" 123\""


[test_6]
input = "-A INPUT ! -s 10.0.0.4/32 -p icmp -j DROP"
remaining = ""

[test_6.expected]
name = "INPUT"
error_1 = "!"
error_2 = "-s 10.0.0.4/32"
protocol = "icmp"
jump = "DROP"

[test_7]
input = "-A INPUT -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT"
expected.log-ip-option = "tag"
remaining = "s"

[test_8]
input = "-A INPUT -m recent --rcheck --seconds 60 --name DEFAULT --rsource -m limit --limit 10/sec -j LOG --log-prefix \"BG \""
expected.log-ip-option = "tag"
remaining = "s"

[test_9]
input = "-A INPUT -s 10.0.0.12/32 -j DROP --tcp-flags FIN,SYN,ACK ACK"
expected.log-ip-option = "tag"
remaining = "s"

[test_10]
input = "-A OUTPUT --match-set BlockedHosts dst,dst -j DROP"
expected.log-ip-option = "tag"
remaining = "s"

[test_11]
input = "-A check_ours -s 10.134.0.68/32 -m mac --mac-source 00:1D:60:2E:ED:CD -j RETURN --log-prefix \"BG \" 123\""
remaining = ""

[test_11.expected]
name = "check_ours"
error_1 = "-s 10.134.0.68/32"
error_2 = "-m mac"
error_3 = "--mac-source 00:1D:60:2E:ED:CD"
jump = "RETURN"
log-prefix = "\"BG \" 123\""