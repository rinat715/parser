[test_14]
input = "-A INPUT -j SETCLASS -p udp --dport 1 --sport 2 --ports 25 --tcp-flags FIN,SYN,ACK ACK"
remaining = ""

[test_14.expected]
action_modifiers = []
errors = [" -j SETCLASS"]
name = "INPUT"

[test_14.expected.protocol]
operator = "EQ"
values = ["udp"]

[[test_14.expected.sports]]
operator = "EQ"
values = [2]

[[test_14.expected.dports]]
operator = "EQ"
values = [1]

[[test_14.expected.ports]]
operator = "EQ"
values = [25]

[[test_14.expected.tcp_flags]]
operator = "NEQ"
values = ["FIN", "SYN"]

[[test_14.expected.tcp_flags]]
operator = "EQ"
values = ["ACK"]

