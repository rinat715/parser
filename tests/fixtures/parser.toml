[test_1]
input = " -j REJECT"
remaining = ""

[test_1.expected]
action = "REJECT"

[test_2]
input = "-A INPUT"
expected.name = "INPUT"
remaining = ""

[test_3]
input = "-A INPUT dfdf"
expected.name = "INPUT dfdf"
remaining = ""

[test_4]
input = " --log-ip-options\ns"
remaining = "\ns"

[test_4.expected.action_modifier_0]
action = "log-ip-options"
option = ""

[test_5]
input = "-A check_ours -j RETURN --log-prefix \"BG \" 123\""
remaining = ""

[test_5.expected]
name = "check_ours"
action = "RETURN"

[test_5.expected.action_modifier_0]
action = "log-prefix"
option = '"BG " 123"'


[test_6]
input = "-A INPUT ! -s 10.0.0.4/32 -p icmp -j DROP"
remaining = ""

[test_6.expected]
name = "INPUT"
error_0 = "!"
error_1 = "-s 10.0.0.4/32"
action = "DROP"

[test_6.expected.protocol]
operator = "EQ"
values = ["icmp"]

[test_7]
input = "-A INPUT -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT"
remaining = ""

[test_7.expected]
name = "INPUT"
error_0 = "-m conntrack"
error_1 = "--ctstate RELATED,ESTABLISHED"
action = "ACCEPT"

[test_8]
input = "-A INPUT -m recent --rcheck --seconds 60 --name DEFAULT --rsource -m limit --limit 10/sec -j LOG --log-prefix \"BG \""
remaining = ""

[test_8.expected]
name = "INPUT"
error_0 = "-m recent"
error_1 = "--rcheck"
error_2 = "--seconds 60"
error_3 = "--name DEFAULT"
error_4 = "--rsource"
error_5 = "-m limit"
error_6 = "--limit 10/sec"
action = "LOG"

[test_8.expected.action_modifier_0]
action = "log-prefix"
option = '"BG "'

[test_9]
input = "-A INPUT -s 10.0.0.12/32 -j DROP --tcp-flags FIN,SYN,ACK ACK"
remaining = ""

[test_9.expected]
name = "INPUT"
error_0 = "-s 10.0.0.12/32"
action = "DROP"
error_1 = "--tcp-flags FIN,SYN,ACK ACK"

[test_10]
input = "-A OUTPUT --match-set BlockedHosts dst,dst -j DROP"
remaining = ""

[test_10.expected]
name = "OUTPUT"
error_0 = "--match-set BlockedHosts dst,dst"
action = "DROP"


[test_11]
input = "-A check_ours -s 10.134.0.68/32 -m mac --mac-source 00:1D:60:2E:ED:CD -j RETURN --log-prefix \"BG \" 123\""
remaining = ""

[test_11.expected]
name = "check_ours"
error_0 = "-s 10.134.0.68/32"
error_1 = "-m mac"
error_2 = "--mac-source 00:1D:60:2E:ED:CD"
action = "RETURN"

[test_11.expected.action_modifier_0]
action = "log-prefix"
option = '"BG " 123"'

[test_12]
input = "-A INPUT -j REJECT --reject-with tcp-reset"
remaining = ""

[test_12.expected]
name = "INPUT"
action = "REJECT"
option = "tcp-reset"

[test_14]
input = "-A INPUT -j SETCLASS -p udp --dport 1 --sport 2 --ports 25 --tcp-flags FIN,SYN,ACK ACK"
remaining = ""

[test_14.expected.protocol]
operator = "EQ"
values = ["udp"]

[test_14.expected]
name = "INPUT"
error_0 = "-j SETCLASS"
error_1 = "--tcp-flags FIN,SYN,ACK ACK"


[[test_14.expected.dports]]
operator = "EQ"
values = [1]

[[test_14.expected.sports]]
operator = "EQ"
values = [2]

[[test_14.expected.ports]]
operator = "EQ"
values = [25]

[test_15]
input = " -p udp ! --ports 25"
remaining = ""

[test_15.expected.protocol]
operator = "EQ"
values = ["udp"]

[[test_15.expected.ports]]
operator = "NEQ"
values = [25]