[test_1]
input = " -j REJECT"
remaining = ""

[test_1.expected]
action = "REJECT"

[test_2]
input = "-A INPUT"
remaining = ""

[test_2.expected]
name = "INPUT"

[test_3]
input = "-A INPUT dfdf"
remaining = ""

[test_3.expected]
name = "INPUT dfdf"

[test_4]
input = " --log-ip-options\ns"
remaining = "\ns"

[[test_4.expected.action_modifiers]]
action = "log-ip-options"
option = ""

[test_5]
input = "-A check_ours -j RETURN --log-prefix \"BG \" 123\""
remaining = ""

[test_5.expected]
name = "check_ours"
action = "RETURN"

[[test_5.expected.action_modifiers]]
action = "log-prefix"
option = '"BG " 123"'


[test_6]
input = "-A INPUT ! -s 10.0.0.4/32 -p icmp -j DROP"
remaining = ""

[test_6.expected]
name = "INPUT"
action = "DROP"

[test_6.expected.Protocol]
operator = "eq"
values = ["icmp"]

[test_6.expected.source]
operator = "neq"

[[test_6.expected.source.values]]
Prefix = 32

[test_6.expected.source.values.Address]
Address = "10.0.0.4"
Version = 4

[test_6.expected.source.values.NetworkID]
Address = "10.0.0.4"
Version = 4

[test_7]
input = "-A INPUT -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT"
remaining = ""

[test_7.expected]
name = "INPUT"
action = "ACCEPT"
conntrack = "conntrack"

[test_8]
input = "-A INPUT -m recent --rcheck --seconds 60 --name DEFAULT --rsource -m limit --limit 10/sec -j LOG --log-prefix \"BG \""
remaining = ""

[test_8.expected]
name = "INPUT"
log = "LOG"

[[test_8.expected.action_modifiers]]
action = "log-prefix"
option = '"BG "'

[test_9]
input = "-A INPUT -s 10.0.0.12/32 -j DROP ! --tcp-flags FIN,SYN,ACK ACK"
remaining = ""

[test_9.expected]
name = "INPUT"
action = "DROP"

[[test_9.expected.tcp_flags]]
operator = "neq"
values = ["RST", "URG", "PSH"]

[[test_9.expected.tcp_flags]]
operator = "eq"
values = ["ACK"]

[test_9.expected.source]
operator = "eq"

[[test_9.expected.source.values]]
Prefix = 32

[test_9.expected.source.values.Address]
Address = "10.0.0.12"
Version = 4

[test_9.expected.source.values.NetworkID]
Address = "10.0.0.12"
Version = 4

[test_10]
input = "-A OUTPUT --match-set BlockedHosts dst,dst -j DROP"
remaining = ""

[test_10.expected]
name = "OUTPUT"
action = "DROP"

[test_11]
input = "-A check_ours -s 10.134.0.68/32 -m mac --mac-source 00:1D:60:2E:ED:CD -j RETURN --log-prefix \"BG \" 123\""
remaining = ""

[test_11.expected]
name = "check_ours"
action = "RETURN"

[[test_11.expected.action_modifiers]]
action = "log-prefix"
option = '"BG " 123"'

[test_11.expected.source]
operator = "eq"

[[test_11.expected.source.values]]
Prefix = 32

[test_11.expected.source.values.Address]
Address = "10.134.0.68"
Version = 4

[test_11.expected.source.values.NetworkID]
Address = "10.134.0.68"
Version = 4

[test_12]
input = "-A INPUT -j REJECT --reject-with tcp-reset"
remaining = ""

[test_12.expected]
name = "INPUT"
action = "REJECT"

[test_12.expected.option]
Value = "tcp-reset"

[test_14]
input = "-A INPUT -j SETCLASS -p udp --dport 1 --sport 2 --ports 25 --tcp-flags FIN,SYN,ACK ACK"
remaining = ""

[test_14.expected]
name = "INPUT"

[test_14.expected.Protocol]
operator = "eq"
values = ["udp"]

[[test_14.expected.source_ports]]
operator = "eq"
values = [2]

[[test_14.expected.destination_ports]]
operator = "eq"
values = [1]

[[test_14.expected.ports]]
operator = "eq"
values = [25]

[[test_14.expected.tcp_flags]]
operator = "neq"
values = ["FIN", "SYN"]

[[test_14.expected.tcp_flags]]
operator = "eq"
values = ["ACK"]

[test_15]
input = " -p udp ! --ports 25"
remaining = ""

[test_15.expected.Protocol]
operator = "eq"
values = ["udp"]

[[test_15.expected.ports]]
operator = "neq"
values = [25]

[test_16]
input = "-s 10.10.140.0/24 -m conntrack --ctorigsrc 10.10.140.3 --ctorigdst 10.0.0.0/8 --ctorigdstport 80:85 -j ACCEPT"
remaining = ""

[test_16.expected]
action = "ACCEPT"
conntrack = "conntrack"

[test_16.expected.source]
operator = "eq"

[[test_16.expected.source.values]]
Prefix = 24

[test_16.expected.source.values.Address]
Address = "10.10.140.0"
Version = 4

[test_16.expected.source.values.NetworkID]
Address = "10.10.140.0"
Version = 4

[test_16.expected.ctorigdst]
operator = "eq"

[[test_16.expected.ctorigdst.values]]
Prefix = 8

[test_16.expected.ctorigdst.values.Address]
Address = "10.0.0.0"
Version = 4

[test_16.expected.ctorigdst.values.NetworkID]
Address = "10.0.0.0"
Version = 4

[[test_16.expected.ctorigdstport]]
operator = "eq"
values = [80]
