option = '"BG " 123"'


[test_6]
input = "-A INPUT ! -s 10.0.0.4/32 -p icmp -j DROP"
remaining = ""

[test_6.expected]
action_modifiers = []
errors = [" !", " -s 10.0.0.4/32"]
name = "INPUT"
action = "DROP"

[test_6.expected.protocol]
operator = "EQ"
values = ["icmp"]

[test_7]
input = "-A INPUT -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT"
remaining = ""

[test_7.expected]
action_modifiers = []
errors = [" -m conntrack", " --ctstate RELATED,ESTABLISHED"]
name = "INPUT"
action = "ACCEPT"

[test_8]
input = "-A INPUT -m recent --rcheck --seconds 60 --name DEFAULT --rsource -m limit --limit 10/sec -j LOG --log-prefix \"BG \""
remaining = ""

[test_8.expected]
errors = [" -m recent", " --rcheck", " --seconds 60", " --name DEFAULT", " --rsource", " -m limit", " --limit 10/sec"]
name = "INPUT"
action = "LOG"
is_log = true

[[test_8.expected.action_modifiers]]
action = "log-prefix"
option = '"BG "'

[test_9]
input = "-A INPUT -s 10.0.0.12/32 -j DROP ! --tcp-flags FIN,SYN,ACK ACK"
remaining = ""

[test_9.expected]
action_modifiers = []
errors = [" -s 10.0.0.12/32"]
name = "INPUT"
action = "DROP"

[[test_9.expected.tcp_flags]]
operator = "NEQ"
values = ["RST", "URG", "PSH"]

[[test_9.expected.tcp_flags]]
operator = "EQ"
values = ["ACK"]

[test_10]
input = "-A OUTPUT --match-set BlockedHosts dst,dst -j DROP"
remaining = ""

[test_10.expected]
action_modifiers = []
errors = [" --match-set BlockedHosts dst,dst"]
name = "OUTPUT"
action = "DROP"

[test_11]
input = "-A check_ours -s 10.134.0.68/32 -m mac --mac-source 00:1D:60:2E:ED:CD -j RETURN --log-prefix \"BG \" 123\""
remaining = ""

[test_11.expected]
errors = [" -s 10.134.0.68/32", " -m mac", " --mac-source 00:1D:60:2E:ED:CD"]
name = "check_ours"
action = "RETURN"

[[test_11.expected.action_modifiers]]
action = "log-prefix"
option = '"BG " 123"'

