                            Version: 4
                        Prefix: 24
        NormalizedDestination:
            - Operator: eq
              Values:
                  - Address:
                        Address: 3.3.3.0
                        Version: 4
                    NetworkID:
                        Address: 3.3.3.0
                        Version: 4
                    Prefix: 24
        Type: netmap
        TranslatedProtocol: []
        NormalizedTranslatedProtocol: []
        TranslatedSourceAddress: []
